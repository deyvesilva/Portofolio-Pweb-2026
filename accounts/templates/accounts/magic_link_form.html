{% extends "portfolio/base.html" %}

{% block content %}
<div class="card" style="max-width: 400px; margin: 40px auto; padding: 20px;">
    <h2>Entrar com Link Mágico</h2>
    <form method="POST">
        {% csrf_token %}
        <div style="margin-bottom: 15px;">
            <label>E-mail:</label>
            <input type="email" name="email" required style="width: 100%; padding: 8px;">
        </div>
        <button type="submit" style="width: 100%; padding: 10px; background: #3182ce; color: white; border: none; border-radius: 5px;">
            Enviar Link
        </button>
    </form>
    <p style="margin-top: 15px; text-align: center;">
        <a href="{% url 'accounts:login' %}">Voltar ao login normal</a>
    </p>
</div>
{% endblock %}
