{% extends "portfolio/base.html" %}

{% block content %}
<div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
    <h2>Criar Nova Conta</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="background: #2d3748; color: white; padding: 10px 20px; border: none; border-radius: 5px; width: 100%;">
            Registar
        </button>
    </form>
</div>
{% endblock %}
